name: Encore CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Backend, database, and frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This service exists only for this job. The run-specific password and
    # database are test-only and are never written to the repository.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: encore_test
          POSTGRES_USER: encore_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encore_ci -d encore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://encore_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/encore_test?schema=public
      DATABASE_URL: postgresql://encore_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/encore_test?schema=public
      JWT_SECRET: encore-ci-only-signing-secret-never-use-outside-tests
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run backend unit tests
        working-directory: server
        run: npm test

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate --config prisma7.config.ts

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate --config prisma7.config.ts

      - name: Apply reviewed migrations to the dedicated CI test database
        working-directory: server
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Run PostgreSQL integration tests
        working-directory: server
        run: npm run test:integration

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        run: npm run build

  e2e:
    name: Browser E2E (isolated PostgreSQL)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A separate disposable database prevents browser tests from sharing the
    # integration suite's database or any persistent developer/provider data.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: encore_e2e_test
          POSTGRES_USER: encore_ci
          POSTGRES_PASSWORD: e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encore_ci -d encore_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://encore_ci:e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/encore_e2e_test?schema=public
      DATABASE_URL: postgresql://encore_ci:e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/encore_e2e_test?schema=public
      DIRECT_DATABASE_URL: postgresql://encore_ci:e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/encore_e2e_test?schema=public
      JWT_SECRET: encore-e2e-ci-only-signing-secret-never-use-outside-tests
      NODE_ENV: test
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ADMIN_EMAIL: encore-e2e-${{ github.run_id }}-${{ github.run_attempt }}@example.test
      E2E_ADMIN_PASSWORD: encore-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}-only
      E2E_EVENT_ID: a2000000-0000-4000-8000-000000000001

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend and Playwright dependencies
        working-directory: client
        run: npm ci

      - name: Validate and generate Prisma Client
        working-directory: server
        run: |
          npx prisma validate --config prisma7.config.ts
          npx prisma generate --config prisma7.config.ts

      - name: Verify the E2E database target is local and empty
        working-directory: server
        run: npm run e2e:database -- preflight

      - name: Apply checked-in migrations to the disposable E2E database
        working-directory: server
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Create test-only administrator and event fixtures
        id: fixtures
        working-directory: server
        run: npm run e2e:database -- fixtures

      - name: Install Chromium for Playwright
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: client
        run: npm run test:e2e

      - name: Remove only E2E fixture records
        if: always() && steps.fixtures.outcome == 'success'
        working-directory: server
        run: npm run e2e:database -- cleanup
