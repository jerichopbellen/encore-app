name: Encore CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Backend, database, and frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This service exists only for this job. The run-specific password and
    # database are test-only and are never written to the repository.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: encore_test
          POSTGRES_USER: encore_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encore_ci -d encore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://encore_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/encore_test?schema=public
      DATABASE_URL: postgresql://encore_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/encore_test?schema=public
      JWT_SECRET: encore-ci-only-signing-secret-never-use-outside-tests
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run backend unit tests
        working-directory: server
        run: npm test

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate --config prisma7.config.ts

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate --config prisma7.config.ts

      - name: Prepare the dedicated CI test database
        working-directory: server
        run: npx prisma db push --config prisma7.config.ts

      - name: Run PostgreSQL integration tests
        working-directory: server
        run: npm run test:integration

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        run: npm run build
